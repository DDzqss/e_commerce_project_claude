name: Backend CI

on:
  push:
    branches: [main, develop]
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    branches: [main, develop]
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: jdclone_test
          POSTGRES_USER: jdclone
          POSTGRES_PASSWORD: jdclone_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U jdclone -d jdclone_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: Mypy
        run: uv run mypy app || true

      - name: Run pytest
        env:
          DATABASE_URL: postgresql+asyncpg://jdclone:jdclone_test_password@localhost:5432/jdclone_test
          REDIS_URL: redis://localhost:6379/0
          SECRET_KEY: ci_test_secret_key_min_32_characters_long
          ENVIRONMENT: dev
        run: uv run pytest -v
