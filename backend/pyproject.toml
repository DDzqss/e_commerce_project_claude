[project]
name = "jd-clone-backend"
version = "0.1.0"
description = "JD-Clone e-commerce platform backend (FastAPI + PostgreSQL + Redis + MinIO)"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
authors = [
    { name = "JD-Clone Team" },
]

dependencies = [
    # Web framework
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    # Validation & settings
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    # ORM & DB drivers
    "sqlalchemy[asyncio]>=2.0.36",
    "greenlet>=3.0",         # sqlalchemy[asyncio] runtime requirement
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",
    # Cache / KV
    "redis>=5.2.0",
    # Auth
    "python-jose[cryptography]>=3.3.0",
    "passlib>=1.7.4",
    "bcrypt>=4.0,<5.0",      # passlib 1.7.x doesn't understand bcrypt 5 API; pin to 4.x
    # Multipart form (uploads)
    "python-multipart>=0.0.17",
    # HTTP client (internal calls, health checks, tests)
    "httpx>=0.28.0",
    # MinIO / S3 (async client, presigned URLs)
    "aioboto3>=13.0.0",
    "botocore>=1.35.0",
]

[project.optional-dependencies]
dev = [
    # Testing
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "fakeredis>=2.26.0",
    "aiosqlite>=0.20.0",
    # Linters & type checkers
    "ruff>=0.8.0",
    "mypy>=1.13.0",
    # Type stubs
    "types-passlib>=1.7.7",
    "types-python-jose>=3.3.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra --strict-markers --strict-config"
testpaths = ["tests"]
asyncio_mode = "auto"
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["passlib.*", "jose.*"]
ignore_missing_imports = true
